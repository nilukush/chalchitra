name: Vercel storage audit

# Read-only census: current deployments team-wide (count/state/age per
# project) + candidate usage endpoints. Dispatched on demand to diagnose
# the deployment-storage dashboard. Uses the repo's permanent VERCEL_TOKEN
# secret; performs NO writes and NO deploys.
on:
  workflow_dispatch:

concurrency:
  group: vercel-storage-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Census current deployments (team-wide)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TEAM: team_ESjn8Fy4BBbh1gZ86oI4wRo5
        run: |
          set -euo pipefail
          # every deployment currently held, all projects, newest first
          curl -fsS -m 60 "https://api.vercel.com/v6/deployments?teamId=$TEAM&limit=100" \
            -H "Authorization: Bearer $VERCEL_TOKEN" > /tmp/d1.json
          node -e '
            const j = JSON.require ? null : null;' 2>/dev/null || true
          node -e '
            const j = JSON.parse(require("fs").readFileSync("/tmp/d1.json","utf8"));
            const ds = j.deployments ?? [];
            const byProject = new Map();
            const now = Date.now();
            for (const d of ds) {
              const p = d.name ?? "(unknown)";
              if (!byProject.has(p)) byProject.set(p, []);
              byProject.get(p).push(d);
            }
            console.log("TOTAL deployments held (page 1):", ds.length, "| metric meta:", JSON.stringify(j.metric?.metricQuantities?.[0]?.label ?? j.metric?.label ?? "n/a"));
            for (const [p, list] of byProject) {
              const states = {};
              for (const d of list) states[d.readyState ?? d.state] = (states[d.readyState ?? d.state] ?? 0) + 1;
              const oldest = Math.round((now - Math.min(...list.map(d => d.created))) / 86400000);
              const prod = list.filter(d => d.target === "production").length;
              console.log(`  ${p}: ${list.length} deployments | states=${JSON.stringify(states)} | production=${prod} | oldest=${oldest}d`);
              for (const d of list.slice(0, 3)) {
                console.log(`    - ${d.uid} ${d.target ?? "preview"} ${d.readyState ?? d.state} ${new Date(d.created).toISOString()} ${(d.meta ?? {}).runningTime ?? ""}`);
              }
            }'
      - name: Pagination census (full count)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TEAM: team_ESjn8Fy4BBbh1gZ86oI4wRo5
        run: |
          set -euo pipefail
          total=0; page=0
          until=""; : > /tmp/flat.json
          while : ; do
            page=$((page+1))
            url="https://api.vercel.com/v6/deployments?teamId=$TEAM&limit=100"
            if [ -n "$until" ]; then url="$url&until=$until"; fi
            resp=$(curl -fsS -m 60 "$url" -H "Authorization: Bearer $VERCEL_TOKEN")
            n=$(printf '%s' "$resp" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);console.log((j.deployments??[]).length); require("fs").appendFileSync("/tmp/flat.json", JSON.stringify((j.deployments??[]).map(x=>({p:x.name,t:x.target,s:x.readyState??x.state,c:x.created})))+"\n")})')
            total=$((total+n)); echo "page $page: $n deployments (cumulative $total)"
            until=$(printf '%s' "$resp" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);console.log(j.pagination?.next??""})') || ""
            if [ -z "$until" ] || [ "$n" -lt 100 ]; then break; fi
            if [ "$page" -ge 20 ]; then echo "capped at 20 pages"; break; fi
          done
          echo "=== TEAM TOTAL CURRENT DEPLOYMENTS: $total ==="
          node -e '
            const fs = require("fs");
            const rows = fs.readFileSync("/tmp/flat.json","utf8").trim().split("\n").flatMap(l => JSON.parse(l));
            const byP = new Map();
            for (const r of rows) byP.set(r.p, (byP.get(r.p) ?? 0) + 1);
            console.log("per-project CURRENT deployment counts:");
            for (const [p, n] of [...byP].sort((a,b) => b[1]-a[1])) console.log(`  ${p}: ${n}`);
            const byS = new Map();
            for (const r of rows) byS.set(r.s, (byS.get(r.s) ?? 0) + 1);
            console.log("by state:", JSON.stringify(Object.fromEntries(byS)));'
      - name: Usage endpoints (best effort)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TEAM: team_ESjn8Fy4BBbh1gZ86oI4wRo5
        run: |
          for ep in "v1/teams/$TEAM/usage" "v9/teams/$TEAM/usage" "v1/teams/$TEAM"; do
            echo "--- $ep ---"
            curl -s -m 30 "https://api.vercel.com/$ep" -H "Authorization: Bearer $VERCEL_TOKEN" | head -c 1200
            echo
          done || true
