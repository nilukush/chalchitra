# Daily near-real-time refresh (Step 8b): diff Wikipedia edits via lastrevid,
# sync TMDB via change lists, pick up new titles, rebuild. Free tier.
#
# Secrets required (repo → Settings → Secrets and variables → Actions):
#   TMDB_API_KEY  — TMDB enrichment (optional: without it TMDB phases skip)
#   AI_API_KEY    — hooks/moods for catalogue titles (optional; cached anyway)
#
# To enable: push this file with the secrets set. The workflow keeps the
# Wikipedia politeness pacing (it runs the same local scripts) and never
# force-refreshes. Deployment of dist/ is host-specific and intentionally left
# as the final step — wire your host's deploy command where marked.

name: Daily refresh

on:
  schedule:
    - cron: '15 5 * * *' # daily 05:15 UTC (after TMDB daily exports ~07:00 UTC? no — before; TMDB changes lag gracefully)
  workflow_dispatch: {} # manual trigger from the Actions tab

concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: write  # release-asset publish (seed cache) needs write

jobs:
  refresh-and-build:
    runs-on: ubuntu-latest
    # corpus growth note: at ~29k cached pages the refresh+dataset+build chain
    # takes ~2.5h; 120 min was silently cancelling runs before the deploy step
    timeout-minutes: 300
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore pipeline caches
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: pipeline-cache-${{ github.run_id }}
          restore-keys: |
            pipeline-cache-

      # bootstrap: first-ever run has no actions/cache — pull the seed release
      - name: Bootstrap cache from seed release (cache miss only)
        run: |
          if [ ! -d data/cache/pages ]; then
            echo "no actions/cache hit — downloading seed release"
            curl -fsSL https://github.com/nilukush/chalchitra/releases/download/seed/pipeline-cache.tar.gz | tar -xz
          else
            echo "cache restored — seed not needed"
          fi

      - name: Refresh Wikipedia (lastrevid diff, paced)
        run: npm run pipeline:refresh

      - name: Sync TMDB change lists
        if: env.TMDB_API_KEY != ''
        run: npm run pipeline:tmdb-changes

      - name: Discover new titles (category crawl, ~10s)
        run: npm run pipeline:titles

      - name: Rebuild dataset
        run: npm run pipeline:dataset

      - name: Refresh trends
        run: npm run pipeline:trends

      # classifier fixes propagate without a local run: re-judge cached
      # frontier entries (kind flips like the Mandela OTT-film fix, rescued
      # rejects); wave size 0 = purely local, no fetching
      - name: Re-classify frontier (local sweep)
        run: npm run pipeline:expand 0

      - name: Build site
        # 28k+ pages exceed Node's default ~4GB old-space on the 7GB runner
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      - name: Save pipeline caches (incremental — pages + api + tmdb + snapshots)
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: pipeline-cache-${{ github.run_id }}

      # publish the refreshed cache as the seed release — Render's static
      # build (and any future cache-miss CI run) downloads it anonymously
      - name: Publish cache seed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf /tmp/pipeline-cache.tar.gz data/cache
          gh release create seed --title "Pipeline cache seed" --notes "Auto-refreshed pipeline cache (data/cache) — consumed by the Render static build and CI bootstrap." --latest 2>/dev/null || true
          gh release upload seed /tmp/pipeline-cache.tar.gz --clobber

      # deploy: GitHub Actions already built dist/ — Vercel receives the
      # PREBUILT artifact (zero Vercel build minutes, no seed download).
      # --archive=tgz sidesteps the 15,000-file upload cap (30k-page growth).
      - name: Deploy to Vercel (prebuilt, archive upload)
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy ./dist --prod --yes --archive=tgz --token "$VERCEL_TOKEN"

      # ── Deploy: wire your host here, e.g. ────────────────────────────────
      # - name: Deploy
      #   run: npx wrangler pages deploy dist --project-name chalchitra
      #   (or rsync dist/ to your host, or commit dist/ to a gh-pages branch)

      - name: Build summary
        run: |
          echo "### Refresh summary" >> $GITHUB_STEP_SUMMARY
          echo "- pages built: $(find dist -name '*.html' | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- movies: $(node -p "require('./data/site-stats.json').movies")" >> $GITHUB_STEP_SUMMARY
          echo "- series: $(node -p "require('./data/site-stats.json').series")" >> $GITHUB_STEP_SUMMARY
          echo "- persons: $(node -p "require('./data/site-stats.json').persons")" >> $GITHUB_STEP_SUMMARY
